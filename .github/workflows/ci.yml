name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  content:
    name: Content checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - run: npm ci
        working-directory: tools
      - run: npm test
        working-directory: tools
      - run: node validate-content.mjs ../content
        working-directory: tools

  web:
    name: Web build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx ng test --watch=false
        working-directory: web
      - run: npx ng build
        working-directory: web

  api:
    name: API build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: api/global.json
      - run: dotnet restore api/Indilingo.slnx
      - run: dotnet build api/Indilingo.slnx -c Release --no-restore
      - run: dotnet test api/Indilingo.slnx -c Release --no-build

  migrations:
    name: Migrations apply to an empty database
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: indilingo
          POSTGRES_USER: indilingo
          POSTGRES_PASSWORD: indilingo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U indilingo -d indilingo"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Flyway migrate
        run: |
          docker run --rm --network host -v "$PWD/db/migrations:/flyway/sql:ro" flyway/flyway:11 \
            -url=jdbc:postgresql://localhost:5432/indilingo -user=indilingo -password=indilingo migrate
