name: Deploy

# Runs after CI is green on main. Order matters: the database changes first, then the API, then the site.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  migrate:
    name: Migrate database
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Flyway migrate
        env:
          FLYWAY_URL: ${{ secrets.FLYWAY_URL }}
          FLYWAY_USER: ${{ secrets.FLYWAY_USER }}
          FLYWAY_PASSWORD: ${{ secrets.FLYWAY_PASSWORD }}
        run: |
          docker run --rm -e FLYWAY_URL -e FLYWAY_USER -e FLYWAY_PASSWORD \
            -v "$PWD/db/migrations:/flyway/sql:ro" flyway/flyway:11 migrate

  api:
    name: Deploy API to Render
    needs: migrate
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: curl --fail --silent --show-error -X POST "$RENDER_DEPLOY_HOOK"
      - name: Wait for the API to answer
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent "$API_URL/api/health/ready" > /dev/null; then echo "API is up"; exit 0; fi
            sleep 10
          done
          echo "API did not come up in time"; exit 1

  web:
    name: Deploy web to Cloudflare
    needs: api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx ng build
        working-directory: web
      - name: Point the site at the API
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          printf 'window.INDILINGO_CONFIG = { apiBaseUrl: "%s/api" };\n' "$API_URL" > web/dist/web/browser/config.js
      - name: Single-page app fallback
        run: echo '/*  /index.html  200' > web/dist/web/browser/_redirects
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy web/dist/web/browser --project-name=${{ vars.CLOUDFLARE_PROJECT }} --branch=main
